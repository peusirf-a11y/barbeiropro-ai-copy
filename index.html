<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050816" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="O CORTE" />
    <meta name="application-name" content="O CORTE" />
    <meta name="description" content="O CORTE — sistema completo de gestão para barbearias: agenda online, clientes, financeiro, equipe e IA de crescimento." />
    <meta property="og:title" content="O CORTE - Gestão para Barbearias" />
    <meta property="og:description" content="Sistema completo para barbearias modernas: agenda online, gestão de clientes, financeiro e IA de crescimento." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="O CORTE - Gestão para Barbearias" />
    <meta name="twitter:description" content="Sistema completo para barbearias modernas: agenda online, gestão de clientes, financeiro e IA de crescimento." />
    <title>O CORTE - Gestão para Barbearias</title>
    <!-- Anti-FOUC: aplica tema antes do React montar para evitar flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ocorte_theme');
          var resolved = stored;
          if (!resolved || resolved === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.classList.add(resolved);
          root.setAttribute('data-theme', resolved);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#050816' : '#F4F7FB');
        } catch (e) { /* noop */ }
      })();
    </script>
    <script>
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (!root || root.childNodes.length === 0) {
          var details = (e.error && (e.error.message + '\n' + (e.error.stack || ''))) || e.message || 'Erro desconhecido';
          document.body.innerHTML = '<div style="background:#050816;color:#fff;min-height:100vh;padding:32px;font-family:monospace;display:flex;align-items:center;justify-content:center;"><div style="background:#0f172a;border:2px solid #ef4444;border-radius:12px;padding:24px;max-width:800px;width:100%;"><h2 style="color:#ef4444;margin-top:0;">Erro Global de Carregamento</h2><pre style="background:#020617;color:#fca5a5;padding:16px;border-radius:8px;white-space:pre-wrap;word-break:break-all;">' + details + '</pre><button onclick="window.location.reload()" style="background:#2563eb;color:#fff;padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;">Recarregar</button></div></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
